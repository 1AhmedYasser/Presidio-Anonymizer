services:
  presidio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estonian-presidio-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=info
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # Configure Hugging Face to use the volume
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      # ONNX Runtime threading configuration
      - ONNX_INTER_OP_THREADS=2  # Number of parallel inferences
      - ONNX_INTRA_OP_THREADS=2  # Threads per inference operation
      # ThreadPoolExecutor configuration
      - MAX_WORKERS=4  # Number of threads for parallel text processing
    volumes:
      - ./config:/app/config:ro
      - models_cache:/app/models  # This persists the downloaded models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - presidio-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'

volumes:
  models_cache:
    driver: local

networks:
  presidio-network:
    driver: bridge